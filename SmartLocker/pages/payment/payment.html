<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Locker Payment | UMAK SmartLocker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="payment.css" />
  </head>
  <body>
    <main class="payment-shell">
      <a class="back-link" href="../dashboard/dashboard.html">&larr; Back to dashboard</a>
      <section class="payment-panel" aria-labelledby="payment-title">
        <div class="payment-heading">
          <div>
            <p class="eyebrow">UMAK SmartLocker</p>
            <h1 id="payment-title">Review your payment</h1>
          </div>
        </div>

        <div class="payment-content" data-payment-content hidden>
          <p class="section-label">Rental summary</p>
          <dl class="payment-summary">
            <div><dt>Locker</dt><dd data-locker></dd></div>
            <div><dt>Rental term</dt><dd data-term></dd></div>
            <div class="total-row"><dt>Total</dt><dd data-amount></dd></div>
          </dl>
          <p class="payment-error" data-payment-error role="alert" hidden></p>
          <form data-payment-form>
            <label class="payment-field" for="payer-name">Full name
              <input id="payer-name" name="payer_name" type="text" maxlength="150" autocomplete="name" required />
            </label>
            <label class="payment-field" for="payer-phone">Mobile number
              <input id="payer-phone" name="payer_phone" type="tel" maxlength="30" autocomplete="tel" required />
            </label>
            <label class="payment-field" for="payment-amount">Amount (PHP)
              <input id="payment-amount" name="amount_pesos" type="number" min="1" step="1" required />
            </label>
            <label class="payment-field" for="receipt-email">UMAK email <span>(optional, for your receipt)</span>
              <input id="receipt-email" name="receipt_email" type="email" maxlength="255" autocomplete="email" placeholder="name@umak.edu.ph" />
            </label>
            <button class="submit-payment" type="submit" data-submit-payment disabled>Submit Payment</button>
          </form>
        </div>

        <div class="payment-loading" data-payment-loading>Loading payment details...</div>

        <div class="payment-success" data-payment-success hidden aria-live="polite">
          <div class="success-mark" aria-hidden="true">&#10003;</div>
          <p class="eyebrow">Payment submitted</p>
          <h2>Payment is being verified</h2>
          <p data-success-message></p>
          <a class="submit-payment dashboard-link" href="../dashboard/dashboard.html">Return to dashboard</a>
        </div>
      </section>
      <p class="payment-footer">UMAK SmartLocker · Rental checkout</p>
    </main>
    <script src="payment.js"></script>
  </body>
</html>
