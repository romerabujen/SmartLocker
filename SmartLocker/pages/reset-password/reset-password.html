<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | SmartLocker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="reset-password.css" />
  </head>
  <body>
    <main class="reset-card">
      <a class="brand" href="../../index.html">
        <img src="../../Photos/UMAKLogo.png" alt="UMAK logo" />
        <span>SmartLocker</span>
      </a>
      <div class="status-mark">🔐</div>
      <p class="eyebrow">ACCOUNT RECOVERY</p>
      <h1>Set a new password</h1>
      <p class="intro">Choose a new password for your SmartLocker account.</p>
      <form id="resetForm">
        <label for="password">New password</label>
        <div class="password-field">
          <input id="password" type="password" minlength="8" required data-reset-password />
          <button type="button" class="password-toggle" aria-label="Show password" title="Show password" data-toggle-password="#password"></button>
        </div>
        <div class="password-requirements" id="passwordRequirements">
          <p>Password must contain:</p>
          <div class="requirement-list">
            <span id="requirement-length">✓ At least 8 characters</span>
            <span id="requirement-uppercase">✓ One uppercase letter</span>
            <span id="requirement-special">✓ One special character</span>
            <span id="requirement-number">✓ One number</span>
          </div>
        </div>
        <label for="confirmPassword">Confirm password</label>
        <div class="password-field">
          <input id="confirmPassword" type="password" minlength="8" required data-reset-confirm />
          <button type="button" class="password-toggle" aria-label="Show password" title="Show password" data-toggle-password="#confirmPassword"></button>
        </div>
        <button type="submit">Reset password</button>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
      <a class="login-link" href="../login/login.html">Return to login</a>
    </main>
    <script>
      const form = document.getElementById('resetForm');
      const message = document.getElementById('message');
      const password = document.getElementById('password');
      const confirmPassword = document.getElementById('confirmPassword');
      const token = new URLSearchParams(window.location.search).get('token') || '';
      const validatePassword = (value) => ({
        length: value.length >= 8,
        uppercase: /[A-Z]/.test(value),
        special: /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(value),
        number: /\d/.test(value)
      });
      const updateRequirements = () => {
        const requirements = validatePassword(password.value);
        Object.entries(requirements).forEach(([name, met]) => {
          document.getElementById(`requirement-${name}`).classList.toggle('met', met);
        });
      };
      password.addEventListener('focus', () => document.getElementById('passwordRequirements').classList.add('is-visible'));
      password.addEventListener('input', updateRequirements);
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        updateRequirements();
        const requirements = validatePassword(password.value);
        if (!Object.values(requirements).every(Boolean)) {
          message.textContent = 'Password does not meet all requirements.';
          return;
        }
        if (password.value !== confirmPassword.value) {
          message.textContent = 'Passwords do not match.';
          return;
        }
        const data = new FormData();
        data.append('token', token);
        data.append('password', password.value);
        const response = await fetch('../../php/password_reset.php', { method: 'POST', body: data });
        const result = await response.json();
        message.textContent = result.message;
        if (result.success) form.hidden = true;
      });
    </script>
    <script src="../../assets/js/script.js?v=20260823-6"></script>
  </body>
</html>
